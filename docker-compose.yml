

services:
  db:
    image: postgres:17-alpine
    container_name: db
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-,audio_db}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mvp-network
  app:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: fastapi
    env_file:
      - .env
    ports:
      - "8000:8000"
    expose:
      - "8000"
    networks:
      - mvp-network
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      celery-worker:
        condition: service_started
    command: >
      bash -c "
      alembic upgrade head && uvicorn app.main:app --port 8000
      "
    # restart: unless-stopped

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"  # Redis-порт
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mvp-network
    restart: unless-stopped
  celery-worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: celery-worker
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery.celery_app worker -E
    networks:
      - mvp-network
    restart: unless-stopped
  ngnix:
    build: 
      context: .
      dockerfile: ./nginx/Dockerfile
    volumes:
      - media:/media
    networks:
      - mvp-network
    depends_on:
      - app
  

networks:
  mvp-network:
    driver: bridge

volumes:
  media:
    driver: local